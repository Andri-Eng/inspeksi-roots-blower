<!-- ==================== MODULE: REWINDING INSPECTION ==================== -->
<div class="app-viewport">
  <div id="rwPageInit" class="auth-card">
    <h2>📋 DATA ORDER - MOTOR REWINDING</h2>
    <div id="rwInitAlert" class="alert-banner">Isikan semua baris dengan benar!</div>
    <div class="form-group"><label>Brand Motor *</label><input type="text" id="rwInitBrand" class="form-control"></div>
    <div class="form-group"><label>Type / Model *</label><input type="text" id="rwInitType" class="form-control"></div>
    <div class="form-group"><label>Power (kW) *</label><input type="text" id="rwInitPower" class="form-control"></div>
    <div class="form-group"><label>Nama Customer *</label><input type="text" id="rwInitCustomer" class="form-control"></div>
    <div class="form-group"><label>No. SO *</label><input type="text" id="rwInitNoSO" class="form-control"></div>
    <div class="form-group"><label>Tanggal *</label><input type="date" id="rwInitDate" class="form-control"></div>
    <div class="form-group"><label>Nama Operator *</label><input type="text" id="rwInitOperator" class="form-control"></div>
    <div class="form-group"><label>Nama Supervisor *</label><input type="text" id="rwInitSupervisor" class="form-control"></div>
    <button type="button" class="btn-submit" style="background-color:#28a745;" onclick="rwProcessInitData()">MULAI INSPEKSI 🚀</button>
    <button type="button" class="btn-back-home" onclick="resetToHome()">🏠 Kembali ke Home</button>
  </div>
  <div id="rwMainSystem" class="main-system">
    <div class="tab-container">
      <button class="nav-btn-home" onclick="resetToHome()">🏠 Home</button>
      <button class="tab-btn active" onclick="rwSwitchTab('inspeksi', this)">Inspeksi</button>
      <button class="tab-btn" onclick="rwSwitchTab('laporan', this)">Laporan</button>
    </div>
    <div id="tab-inspeksi" class="tab-content active">
      <div class="sheet">
        <table class="header-table">
          <tr><td style="width: 120px;"><img src="logo-intidaya.jpg" style="max-height: 45px;"></td><td class="title-header">MOTOR REWINDING - INSPEKSI</td><td style="width: 120px;"><img src="logo-iso.jpg" style="max-height: 45px;"></td></tr>
        </table>
        <p style="padding: 10px; background: #f8fafc; border-radius: 4px;">ℹ️ Modul REWINDING sedang dalam tahap pengembangan.</p>
        <button type="button" class="btn-action" onclick="rwOpenReview()">🔍 Preview</button>
      </div>
    </div>
    <div id="tab-laporan" class="tab-content">
      <div class="sheet">
        <div style="margin-top: 30px; display: flex; justify-content: space-between; text-align: center;">
          <div style="width: 40%;"><b>Diperiksa:</b><br><br><br><u id="rwLblOp" style="font-weight: bold;">-</u></div>
          <div style="width: 40%;"><b>Disetujui:</b><br><br><br><u id="rwLblSup" style="font-weight: bold;">-</u></div>
        </div>
        <button type="button" class="btn-action" onclick="rwOpenReview()">🔍 Preview</button>
      </div>
    </div>
  </div>
</div>
<div id="rwReviewModal" class="preview-modal">
  <div class="preview-modal-content" style="width: 1000px; max-width: 95vw; height: 90vh; display: flex; flex-direction: column;">
    <div class="preview-modal-header"><span>📄 PREVIEW - REWINDING</span><span class="close-modal" onclick="rwCloseReview()">&times;</span></div>
    <div id="rwPreviewContainer" style="overflow-y: auto; flex: 1; background: #e5e7eb; padding: 15px;"></div>
    <div style="display: flex; gap: 10px; margin-top: 15px;">
      <button type="button" class="btn-action" style="background-color: #6c757d; flex: 1;" onclick="rwCloseReview()">❌ Tutup</button>
      <button type="button" class="btn-action" style="background-color: #28a745; flex: 2;" onclick="printPage()">🖨️ Print</button>
    </div>
  </div>
</div>
<style>
  .main-system { width: 100%; display: none; overflow-x: auto; }
  .nav-btn-home { background-color: #dc3545; color: white; border: none; padding: 12px 15px; font-weight: bold; font-size: 13px; border-radius: 8px 8px 0 0; cursor: pointer; }
  .nav-btn-home:hover { background-color: #bb2d3b; }
  .preview-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 1000; }
  .preview-modal-content { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
  .preview-modal-header { font-weight: bold; font-size: 16px; border-bottom: 2px solid #007bff; padding-bottom: 10px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
  .close-modal { cursor: pointer; font-size: 20px; color: #888; font-weight: bold; }
</style>
<script>
  function rwProcessInitData() {
    const op = document.getElementById('rwInitOperator').value || '-';
    const sup = document.getElementById('rwInitSupervisor').value || '-';
    document.getElementById('rwLblOp').textContent = op;
    document.getElementById('rwLblSup').textContent = sup;
    document.getElementById('rwPageInit').style.display = 'none';
    document.getElementById('rwMainSystem').style.display = 'block';
  }
  function rwSwitchTab(t, b) {
    document.querySelectorAll('#rwMainSystem .tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('#rwMainSystem .tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById('tab-' + t).classList.add('active');
    b.classList.add('active');
  }
  function rwOpenReview() { document.getElementById('rwReviewModal').style.display = 'flex'; }
  function rwCloseReview() { document.getElementById('rwReviewModal').style.display = 'none'; }
</script>
